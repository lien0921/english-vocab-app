<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VocabApp">

    <title>英文單字 3D 閃示卡 - 全系列</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <style>
        /* 新增的分級按鈕樣式 */
        .level-nav {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lvl-btn {
            padding: 8px 20px;
            border: 2px solid #6366f1;
            background: white;
            color: #6366f1;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .lvl-btn.active {
            background: #6366f1;
            color: white;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Vocab App <span id="currentLevelText">A1</span></h1>
            
            <div class="level-nav">
                <button class="lvl-btn active" onclick="switchLevel('A1', this)">A1</button>
                <button class="lvl-btn" onclick="switchLevel('A2', this)">A2</button>
                <button class="lvl-btn" onclick="switchLevel('B1', this)">B1</button>
                <button class="lvl-btn" onclick="switchLevel('B2', this)">B2</button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜尋單字或中文...">
            </div>
            
            <div id="alphabet-nav" class="alphabet-buttons"></div>
            <div id="stats" class="stats">載入中...</div>
        </header>

        <main id="vocabList" class="vocab-grid">
            </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
